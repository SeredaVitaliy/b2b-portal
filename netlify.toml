[build]
  command = "mkdir -p client/netlify/database && cp -R netlify/database/migrations client/netlify/database/ && npm install --no-save @netlify/database@1 && npm run build -w client"
  publish = "client/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
